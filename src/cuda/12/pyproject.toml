# bartorch's library compiled with CUDA 12, which `bartorch[cu12]` installs.
# The same CMake project as bartorch's own pyproject, configured with
# BARTORCH_CUDA_PACKAGE, which puts the library and its FINUFFT modules in
# bartorch_cuda12/ and nothing else; bartorch loads it from there when torch
# is a CUDA 12 build.  Built with CUDA 12.6, the runtime torch's oldest CUDA 12
# build ships, so it runs against every CUDA 12 torch.
[build-system]
requires = [
    "scikit-build-core>=0.11",
    "setuptools-scm>=8",
    "mkl-include; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
build-backend = "scikit_build_core.build"

[project]
name = "bartorch-cuda12"
dynamic = ["version", "dependencies"]
description = "bartorch's library compiled with CUDA 12, for bartorch[cu12]"
readme = { text = "bartorch's library compiled with CUDA 12. Install it as `pip install bartorch[cu12]`; see https://github.com/pulserver/bartorch.", content-type = "text/markdown" }
license = "MIT"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/pulserver/bartorch"

[tool.scikit-build]
cmake.source-dir = "../../.."
cmake.build-type = "Release"
build-dir = "../../../build/cuda12-{wheel_tag}"
cmake.define.BARTORCH_CUDA = "ON"
cmake.define.BARTORCH_CUDA_PACKAGE = "12"
wheel.packages = []
wheel.py-api = "py3"

[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.setuptools_scm"

# The library is bartorch's ABI, so it is pinned to the bartorch it was built
# with.  The runtime libraries are the ones torch's CUDA 12 builds bring.
[[tool.dynamic-metadata]]
field = "dependencies"
provider = "scikit_build_core.metadata.template"
result = [
    "bartorch=={project[version]}",
    "nvidia-cuda-runtime-cu12>=12.6",
    "nvidia-cufft-cu12>=11.3",
    "nvidia-cublas-cu12>=12.6",
]

[tool.setuptools_scm]
root = "../../.."
fallback_version = "0.0.0"
