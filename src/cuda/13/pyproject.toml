# bartorch's library compiled with CUDA 13, which `bartorch[cu13]` installs.
# The same CMake project as bartorch's own pyproject, configured with
# BARTORCH_CUDA_PACKAGE, which puts the library and its FINUFFT modules in
# bartorch_cuda13/ and nothing else; bartorch loads it from there when torch
# is a CUDA 13 build.  Built with CUDA 13.0, the runtime torch's oldest CUDA 13
# build ships, so it runs against every CUDA 13 torch.
[build-system]
requires = [
    "scikit-build-core>=0.11",
    "setuptools-scm>=8",
    "mkl-include; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
build-backend = "scikit_build_core.build"

[project]
name = "bartorch-cuda13"
dynamic = ["version", "dependencies"]
description = "bartorch's library compiled with CUDA 13, for bartorch[cu13]"
readme = { text = "bartorch's library compiled with CUDA 13. Install it as `pip install bartorch[cu13]`; see https://github.com/pulserver/bartorch.", content-type = "text/markdown" }
license = "MIT"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/pulserver/bartorch"

[tool.scikit-build]
cmake.source-dir = "../../.."
cmake.build-type = "Release"
build-dir = "../../../build/cuda13-{wheel_tag}"
cmake.define.BARTORCH_CUDA = "ON"
cmake.define.BARTORCH_CUDA_PACKAGE = "13"
wheel.packages = []
wheel.py-api = "py3"

[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.setuptools_scm"

# The library is bartorch's ABI, so it is pinned to the bartorch it was built
# with.  The runtime libraries are the ones torch's CUDA 13 builds bring, whose
# names carry no CUDA suffix where CUDA 12's carry -cu12.
[[tool.dynamic-metadata]]
field = "dependencies"
provider = "scikit_build_core.metadata.template"
result = [
    "bartorch=={project[version]}",
    "nvidia-cuda-runtime>=13.0",
    "nvidia-cufft>=12.0",
    "nvidia-cublas>=13.0",
]

[tool.setuptools_scm]
root = "../../.."
fallback_version = "0.0.0"
