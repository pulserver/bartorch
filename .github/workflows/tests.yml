name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # The toolchains are upstream BART's: GCC 14 on Linux, whose heap
  # trampolines carry BART's nested functions, and clang on macOS, where they
  # become Blocks.  Each platform runs the oldest and the newest Python the
  # package supports; the wheel workflow tests the wheel on both as well.
  # Windows is clang from MSYS2's CLANG64 environment, linked against the
  # Universal C Runtime that official CPython uses.
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            cc: gcc-14
            extras: "[mkl]"
            # FINUFFT's FFT from oneMKL, the source-build alternative to
            # DUCC0; the wheels and every other job carry DUCC0.
            finufft-fft: MKL
          - os: ubuntu-latest
            python-version: "3.14"
            cc: gcc-14
            # The wheel's build: DUCC0 in the library, and beside it FINUFFT
            # modules on oneMKL, which the mkl extra puts in the process.  The
            # correction and learning extras are here so that the job
            # measuring coverage runs the resampling, susceptibility and
            # training paths the others skip.
            extras: "[mkl,correct,pyhysco,learning]"
            # One job measures coverage for Codecov; the rest only test.
            coverage: true
          - os: macos-latest
            python-version: "3.10"
            cc: clang
          - os: macos-latest
            python-version: "3.14"
            cc: clang
          - os: windows-latest
            python-version: "3.10"
            cc: clang
          - os: windows-latest
            python-version: "3.14"
            cc: clang
    runs-on: ${{ matrix.os }}
    # A hung test otherwise holds the runner for GitHub's six-hour default.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    # Codecov takes the upload on GitHub's OIDC token, so no secret is needed.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools-scm reads the version from the tag history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install compiler, OpenMP and CMake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y cmake ${{ matrix.cc }} libomp-dev

      # libomp for omp.h alone: the library links against the OpenMP
      # runtime torch carries, not against Homebrew's (cmake/openmp.cmake).
      - name: Install CMake and the OpenMP header (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake libomp

      # omp.h comes from the openmp package; the library links against the
      # OpenMP runtime torch carries, not against MSYS2's.
      - name: Install clang, CMake and Ninja (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-llvm-openmp
            mingw-w64-clang-x86_64-llvm-tools

      - name: Put CLANG64 on the path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\clang64\bin" >> $env:GITHUB_PATH
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV

      # long is 32 bits here, which is the case the fixed-width types exist
      # for; this prints it, and tests/test_abi.py holds the library to it.
      - name: The data model (Windows)
        if: runner.os == 'Windows'
        run: |
          printf '#include <stdio.h>\nint main(void) { printf("long %%d, long long %%d, void* %%d\\n", (int)sizeof(long), (int)sizeof(long long), (int)sizeof(void*)); return 4 != sizeof(long); }\n' > model.c
          clang model.c -o model.exe
          ./model.exe

      - name: Install torch (CPU) and the build backend
        run: |
          pip install scikit-build-core setuptools-scm numpy scipy pytest pytest-cov numpydoc
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # The io extra, so that the ISMRMRD, DICOM and NIfTI files are read
          # and written on every platform.
          pip install ismrmrd pydicom nibabel

      # deepinv pulls in torchvision, whose compiled operators are built
      # against one particular torch.  Left to PyPI it takes the default
      # build while torch here is the CPU one, and the mismatch shows up as
      # `operator torchvision::nms does not exist` the moment deepinv is
      # imported.  Taking it from the same index makes the pair agree.
      #
      # Every job needs this now: deepinv is a dependency rather than an
      # extra, so every install pulls torchvision whatever the matrix says.
      # Linux only because that index publishes no macOS wheel -- there both
      # come from PyPI, which is consistent with itself.
      - name: Install torchvision from the same index as torch
        if: runner.os != 'macOS'
        run: pip install torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install oneMKL's headers and library for FINUFFT
        if: matrix.finufft-fft == 'MKL'
        run: pip install mkl mkl-devel

      # The FFTW3 header the FINUFFT modules on oneMKL are compiled against,
      # which the build system requires on x86-64 Linux and an install
      # without build isolation has to bring itself.
      - name: Install oneMKL's FFTW3 header (Linux)
        if: runner.os == 'Linux' && matrix.finufft-fft != 'MKL'
        run: pip install mkl-include

      - name: Build and install bartorch
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'gcc-14' && 'g++-14' || 'clang++' }}
        run: >-
          pip install -e ".${{ matrix.extras }}" --no-build-isolation -v
          ${{ matrix.finufft-fft && format('-C cmake.define.BARTORCH_FINUFFT_FFT={0}', matrix.finufft-fft) || '' }}

      # The library imports the system's DLLs and torch's OpenMP runtime and
      # nothing from MSYS2, so it loads into official CPython without it.
      # FINUFFT is compiled in, so its C++ runtime and threads are the
      # library's own too.
      - name: Nothing from MSYS2 in the library (Windows)
        if: runner.os == 'Windows'
        run: |
          lib=$(python -c "from bartorch._lib import library_path; print(library_path())")
          llvm-readobj --coff-imports "$lib" | grep 'Name:' | sort -u | tee imports.txt
          ! grep -Ei 'libomp|libgomp|libc\+\+|libunwind|libwinpthread|libgcc|libstdc|msys|finufft' imports.txt
          grep -qi 'libiomp5md.dll' imports.txt

      # The runtime torch carries is the one OpenMP runtime: the library's
      # load commands name it and nothing else.
      - name: The library names torch's OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          lib=$(python -c "from bartorch._lib import library_path; print(library_path())")
          otool -L "$lib" | tee loads.txt
          otool -l "$lib" | grep -A2 LC_RPATH
          grep -q '@rpath/libomp.dylib' loads.txt
          ! grep -Ei 'homebrew|/usr/local/opt|finufft' loads.txt

      # Before the suite, because the suite is where the information goes
      # missing: bringing the library up is what installs the FINUFFT
      # substitution, probing itself by running `bart nufft` both ways, and
      # pytest has stdout and stderr captured for collection, so a process
      # that dies there dies with the reason unprinted.  Run it once with the
      # log going straight to the console, so a failure says what it was.
      - name: Report what the library came up with
        run: |
          python - <<'EOF'
          import logging, traceback
          logging.basicConfig(level=logging.DEBUG, format="%(name)s: %(message)s")
          import bartorch
          print("build:", bartorch.build_info())
          import ctypes, sys
          print("platform:", sys.platform, "sizeof(long):", ctypes.sizeof(ctypes.c_long))
          print("backends:", bartorch.backend_sources())
          try:
              from bartorch import _finufft
              print("finufft compiled in:", _finufft.available(), _finufft.version())
              print("cufinufft compiled in:", _finufft.cuda_available())
              _finufft.install_once()
              print("finufft in tools:", _finufft.used_in_tools())
          except Exception:
              # A diagnostic must not be able to fail the thing it is
              # diagnosing.  An abort still ends the job, which is the point;
              # a name that moved should not.
              traceback.print_exc()
          EOF

      # Threaded torch and threaded FINUFFT in one process, in either import
      # order, with the OpenMP runtimes it loaded listed: one on macOS and
      # Windows, and it is torch's.  Run on its own before the suite so that
      # a process ended by a second runtime is reported as that.
      - name: One OpenMP runtime with torch and FINUFFT threaded together
        run: pytest tests/test_openmp.py -v -s

      - name: Which earlier test hangs the next mobafit (temporary, Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 45
        continue-on-error: true
        run: python scripts/bisect_hang.py

      - name: Run the test suite
        if: runner.os != 'Windows'
        run: pytest tests/ -v ${{ matrix.coverage && '--cov --cov-report=xml' || '' }}

      # A rejected upload is a broken report, not a passing build: without
      # this the step is green whatever Codecov answers, and the badge goes
      # stale with nothing to say so.
      - uses: codecov/codecov-action@v5
        if: matrix.coverage
        with:
          use_oidc: true
          fail_ci_if_error: true
          files: coverage.xml

  # The runners have no GPU, so the CUDA build is checked as far as a machine
  # without a card allows: it compiles, links, loads, and runs the host suite.
  cuda-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools-scm reads the version from the tag history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the CUDA toolkit and GCC
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake gcc-14 g++-14 g++-12 nvidia-cuda-toolkit

      - name: Install torch (CPU) and the build backend
        run: |
          pip install scikit-build-core setuptools-scm numpy scipy pytest numpydoc
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # As in the test matrix: torchvision comes with deepinv, and its
      # compiled operators are built against one particular torch.  From PyPI
      # it takes the default build while torch here is the CPU one, and the
      # mismatch is `operator torchvision::nms does not exist` the moment
      # deepinv is imported.  Same index, same pair.
      - name: Install torchvision from the same index as torch
        run: pip install torchvision --index-url https://download.pytorch.org/whl/cpu

      # BART is GCC 14's, for its heap trampolines; the host side of the
      # kernels is GCC 12's, the newest this distribution's nvcc accepts.
      # That nvcc is CUDA 12.0, which has no atomicAdd on float2 for compute
      # capability 9.0 and so cannot compile cuFINUFFT for it; the wheel's
      # toolkit is 12.8 and builds all five.
      - name: Build with BART's CUDA kernels and cuFINUFFT
        env:
          CC: gcc-14
          CXX: g++-14
          CUDAHOSTCXX: g++-12
        run: >-
          pip install -e . --no-build-isolation
          --config-settings=cmake.define.BARTORCH_CUDA=ON
          "--config-settings=cmake.define.BARTORCH_CUDA_ARCHITECTURES=75;80;86;89"

      - name: The CUDA build must report its device code and run on the host
        run: |
          python -c "import bartorch; assert 'cuda=ON' in bartorch.build_info()"
          python -c "from bartorch import _finufft; assert _finufft.available() and _finufft.cuda_available()"
          pytest tests/ -v
