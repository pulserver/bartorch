name: Publish to PyPI

# Wheels carry a Python-independent C library, so one wheel per platform
# serves every interpreter and every torch version.  They are built with
# cibuildwheel from a pure-Python "py3" target and published through PyPI's
# trusted publisher on a version tag, together with the CUDA builds of the
# library, bartorch-cuda12 and bartorch-cuda13.
#
# One-time setup on PyPI: a trusted publisher on each of the three projects
# for owner pulserver, repository bartorch, workflow publish.yml, environment
# pypi, and the "pypi" environment in this repository's settings.

on:
  push:
    tags:
      - "v*"
  # A tag is the one thing that cannot be taken back: the version it builds
  # can never be reused on PyPI, so a defect in this file must not wait for a
  # release to appear.  A pull request that changes what the wheels are made
  # from, and a run by hand, build, repair and test every wheel exactly as a
  # tag would; what they do not do is publish, because the job that hands
  # anything over asks for a tag ref and a branch is not one.
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - CMakeLists.txt
      - cmake/**
      - pyproject.toml
      - src/cuda/**
      - src/bartorch/_lib.py
  workflow_dispatch:

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools-scm reads the version from the tag history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # No Linux aarch64 wheel yet: the sdist serves it, and a wheel for it
        # is a matter of a runner rather than of a dependency.
        #
        # Windows is CPU only: clang from MSYS2's CLANG64 environment, which
        # links against the Universal C Runtime official CPython uses.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools-scm reads the version from the tag history.
          fetch-depth: 0
      - name: Install clang, CMake and Ninja (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-llvm-openmp
            mingw-w64-clang-x86_64-llvm-tools
      - name: Put CLANG64 on the path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\clang64\bin" >> $env:GITHUB_PATH
      - uses: pypa/cibuildwheel@v2.23
        env:
          # One build per platform: the wheel is tagged py3 and carries no
          # interpreter, so building it once per Python would only produce the
          # same file under the same name.  What the interpreters get is the
          # test matrix below.
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-musllinux_*"
          # cibuildwheel's Linux default is auto64 *and* auto32, so an x86_64
          # runner also builds a 32-bit i686 wheel -- in the i686 image, which
          # is still manylinux2014 and its GCC 10.  Nobody could install that
          # wheel in any case: torch publishes no i686 build, and it is a hard
          # dependency here.
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          # libgomp.so.1 is the one torch carries in torch/lib, so the wheel
          # vendors none and the process has one OpenMP runtime.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair --exclude libgomp.so.1 -w {dest_dir} {wheel}
          # The library imports the system's DLLs and the OpenMP runtime torch
          # carries, so there is nothing to vendor and no repair step.
          CIBW_ENVIRONMENT_WINDOWS: CC=clang CXX=clang++ CMAKE_GENERATOR=Ninja
          # omp.h for macOS; the library links against torch's runtime, not
          # Homebrew's, so there is nothing to vendor there either.  delocate
          # would try to vendor @rpath/libomp.dylib, which is torch's.
          CIBW_BEFORE_ALL_MACOS: brew install libomp
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""
          # BART's nested functions need heap trampolines -- GCC 14 -- or
          # clang's Blocks.  cibuildwheel's default Linux image has neither:
          # manylinux2014 is CentOS 7, whose GCC is 10 and whose `clang` is
          # 3.4.2, so old that it cannot link a hello world against the
          # devtoolset runtime it is installed beside.  manylinux_2_28 is the
          # image the CUDA wheel below already builds in, and its default cc
          # is GCC 14.2.1: nothing to install, and no compiler to override.
          # The floor it sets, glibc 2.28, is the one torch and FINUFFT
          # already ship their own Linux wheels against.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # FINUFFT is compiled in, so the non-Cartesian tests run with no
          # finufft package installed.
          CIBW_TEST_REQUIRES: pytest numpy scipy
          CIBW_TEST_COMMAND: pip install torch --index-url https://download.pytorch.org/whl/cpu && pytest {project}/tests -q
      # What the wheel carries and what its library loads: the license
      # notices of everything compiled in, one library and on x86-64 its
      # FINUFFT modules for x86-64-v2, v3 and v4 (on Linux also on oneMKL), and on each platform
      # no OpenMP runtime or C++ runtime of its own besides what is stated.
      - name: Inspect the wheel
        shell: bash
        run: |
          python -m zipfile -l wheelhouse/*.whl | tee contents.txt
          grep -q 'licenses/external/finufft/LICENSE' contents.txt
          grep -q 'licenses/finufft-dependencies/DUCC0/LICENSE' contents.txt
          grep -q 'licenses/finufft-dependencies/xsimd/LICENSE' contents.txt
          ! grep -Ei 'finufft/.*\.(so|dylib|dll)|libomp|libiomp|libgomp' contents.txt
          mkdir unpacked && python -m zipfile -e wheelhouse/*.whl unpacked
          case "${{ runner.os }}" in
            Linux)
              pip install auditwheel && auditwheel show wheelhouse/*.whl
              readelf -d unpacked/bartorch/libbartorch.so | grep NEEDED
              for m in unpacked/bartorch/libbartorch_finufft_x86_64_v{2,3,4}.so; do readelf -d "$m" | grep NEEDED; done
              # On oneMKL, bound at run time: no MKL library named.
              for m in unpacked/bartorch/libbartorch_finufft_x86_64_v{2,3,4}_mkl.so; do
                readelf -d "$m" | grep NEEDED | tee needed.txt
                ! grep -i mkl needed.txt
              done ;;
            macOS)
              otool -L unpacked/bartorch/libbartorch.dylib | tee loads.txt
              ! grep -Ei 'homebrew|/usr/local/opt' loads.txt ;;
            Windows)
              llvm-readobj --coff-imports unpacked/bartorch/libbartorch.dll unpacked/bartorch/libbartorch_finufft_x86_64_v{2,3,4}.dll | grep 'Name:' | sort -u | tee imports.txt
              ! grep -Ei 'libomp|libgomp|libc\+\+|libunwind|libwinpthread|msys' imports.txt ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # The wheel carries no interpreter, so what has to be checked across Python
  # versions is that the package drives it: ctypes signatures, the torch and
  # numpy APIs it uses, and the tools' generated wrappers.
  test-wheels:
    name: Test ${{ matrix.os }} on Python ${{ matrix.python }}
    needs: [wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest and the newest Python the package supports.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
          pip install pytest numpy scipy wheelhouse/*.whl
          ! pip show finufft cufinufft
          pytest tests/test_openmp.py -v -s
          pytest tests -q

  # The library compiled with CUDA is a package of its own per CUDA major
  # version, bartorch-cuda12 and bartorch-cuda13 (src/cuda/), which bartorch
  # loads in place of its own library: `pip install bartorch[cu12]`.  Each
  # carries the device code and links the runtime libraries dynamically, which
  # torch's CUDA builds bring, so it stays under PyPI's 100 MB a file rather
  # than bundling cuFFT and cuBLAS.  Each is compiled with the oldest toolkit
  # of its major that torch ships, so that it runs against every torch of it.
  #
  # The runners have no card, so this proves the wheel loads and reports the
  # absence of one; scripts/check_device.py is what a machine with a card runs.
  wheels-cuda:
    name: Build bartorch-cuda${{ matrix.cuda }} (linux x86_64)
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      fail-fast: false
      matrix:
        include:
          # CUDA 12.6's nvcc takes GCC 13 at the newest as the host compiler of
          # the kernels; BART itself stays on the image's GCC 14.
          - cuda: "12"
            toolkit: "12-6"
            home: /usr/local/cuda-12.6
            host: gcc-toolset-13-gcc-c++
            hostcxx: /opt/rh/gcc-toolset-13/root/usr/bin/g++
            runtime: libcudart.so.12 libcufft.so.11 libcublas.so.12 libcublasLt.so.12
          - cuda: "13"
            toolkit: "13-0"
            home: /usr/local/cuda-13.0
            host: ""
            hostcxx: ""
            runtime: libcudart.so.13 libcufft.so.12 libcublas.so.13 libcublasLt.so.13
    env:
      CUDA_HOME: ${{ matrix.home }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # setuptools-scm reads the version from the tag history.
          fetch-depth: 0
      - name: Install the CUDA toolkit
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --add-repo \
            https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
          dnf install -y --nogpgcheck cuda-nvcc-${{ matrix.toolkit }} cuda-cudart-devel-${{ matrix.toolkit }} \
            libcufft-devel-${{ matrix.toolkit }} libcublas-devel-${{ matrix.toolkit }} ${{ matrix.host }}
          echo $CUDA_HOME/bin >> $GITHUB_PATH
          echo /opt/python/cp312-cp312/bin >> $GITHUB_PATH
      # BART needs GCC 14 for -ftrampoline-impl=heap, or clang 16+ for Blocks;
      # the manylinux image's default toolchain is checked at configure time
      # and the build fails loudly if it is older.
      # The pair kernels are cuFFTDx, whose headers come with MathDx: only the
      # build reads them, and the wheel carries what they compile to, so a
      # machine running it needs the driver and nothing else.  The sizes and
      # ranks they are compiled for are BARTORCH_PAIRED_SIZES's and
      # BARTORCH_PAIRED_RANKS's defaults (CMakeLists.txt).
      - name: Fetch MathDx
        run: |
          python -m pip install nvidia-mathdx==25.6.0
          echo "MATHDX_DIR=$(python -c 'import os, sysconfig; print(os.path.join(sysconfig.get_paths()["purelib"], "nvidia", "mathdx"))')" >> $GITHUB_ENV
      - name: Build the wheel
        env:
          CUDACXX: ${{ matrix.home }}/bin/nvcc
        run: |
          if [ -n "${{ matrix.hostcxx }}" ]; then export CUDAHOSTCXX=${{ matrix.hostcxx }}; fi
          cc --version
          python -m pip install build
          python -m build --wheel --outdir dist/ src/cuda/${{ matrix.cuda }} \
            -C "cmake.define.BARTORCH_MATHDX_DIR=$MATHDX_DIR"
      # The CUDA runtimes and libgomp are excluded rather than vendored: torch
      # already brings them, bundling the first would add hundreds of
      # megabytes, and a second libgomp would be a second OpenMP runtime.
      - name: Repair to a manylinux tag
        run: |
          /opt/python/cp312-cp312/bin/python -m pip install auditwheel
          excludes=""
          for lib in ${{ matrix.runtime }} libgomp.so.1; do excludes="$excludes --exclude $lib"; done
          LD_LIBRARY_PATH=$CUDA_HOME/lib64 \
          /opt/python/cp312-cp312/bin/python -m auditwheel repair dist/*.whl \
            -w wheelhouse/ --plat manylinux_2_28_x86_64 $excludes
      # cuFINUFFT is in the library, bound to the same cudart and cuFFT as
      # BART's kernels, and nothing is vendored beside it.  PyPI takes a file
      # of 100 MB at most unless a project is granted more.
      - name: Inspect the CUDA wheel
        run: |
          /opt/python/cp312-cp312/bin/python -m auditwheel show wheelhouse/*.whl
          /opt/python/cp312-cp312/bin/python -m zipfile -l wheelhouse/*.whl | tee contents.txt
          ! grep -Ei 'libcudart|libcufft|libcublas|libgomp|cufinufft.*\.so' contents.txt
          grep -q 'bartorch_cuda${{ matrix.cuda }}/libbartorch.so' contents.txt
          grep -q 'licenses/external/finufft/LICENSE' contents.txt
          grep -q 'licenses/finufft-dependencies/DUCC0/LICENSE' contents.txt
          ! grep -E '^ *bartorch/' contents.txt
          size=$(stat -c %s wheelhouse/*.whl)
          echo "wheel: $size bytes"
          test "$size" -lt 100000000
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-wheel-${{ matrix.cuda }}
          path: wheelhouse/*.whl

  # What a user installs: the bartorch wheel with its extra, beside torch's
  # build for the same CUDA major version, on the oldest and the newest Python
  # the package supports.  The runners have no card, so this proves that the
  # install resolves -- the pins of the CUDA build against torch's -- that
  # bartorch loads the CUDA build, and that its runtime libraries are the ones
  # torch's NVIDIA packages installed; scripts/check_device.py is what a
  # machine with a card runs.
  test-cuda-wheels:
    name: Test bartorch[cu${{ matrix.cuda }}] on Python ${{ matrix.python }}
    needs: [wheels, wheels-cuda]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12", "13"]
        python: ["3.10", "3.14"]
        include:
          - cuda: "12"
            torch: cu126
          - cuda: "13"
            torch: cu130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: base
      - uses: actions/download-artifact@v4
        with:
          name: cuda-wheel-${{ matrix.cuda }}
          path: cuda
      # Both wheels are named as files, so pip takes them whatever their
      # version, and the extra's requirement is the CUDA wheel given beside it.
      - name: Install bartorch[cu${{ matrix.cuda }}] with torch's ${{ matrix.torch }} build
        run: |
          python -m pip install --upgrade pip
          pip install "$(ls base/*.whl)[cu${{ matrix.cuda }}]" cuda/*.whl pytest \
            torch --index-url https://download.pytorch.org/whl/${{ matrix.torch }} \
            --extra-index-url https://pypi.org/simple
          pip list | grep -Ei '^(torch|bartorch|nvidia-(cuda-runtime|cufft|cublas))'
      - name: bartorch loads the CUDA build against torch's runtime
        run: |
          python -c "
          import torch, bartorch
          from bartorch import _cuda, _finufft
          from bartorch._lib import library_path
          info = bartorch.build_info()
          print(torch.__version__, library_path(), info)
          assert torch.version.cuda.split('.')[0] == '${{ matrix.cuda }}', torch.version.cuda
          assert library_path().parent.name == 'bartorch_cuda${{ matrix.cuda }}', library_path()
          assert 'cuda=ON' in info, info
          assert _finufft.available() and _finufft.cuda_available()
          maps = open('/proc/self/maps').read()
          cudart = {l.split()[-1] for l in maps.splitlines() if 'libcudart.so' in l}
          print('cudart:', cudart)
          assert cudart and all('/site-packages/nvidia/' in p for p in cudart), cudart
          print('devices:', _cuda.device_count())
          "
      - name: Run the suite's library and device files against it
        run: pytest tests/test_lib.py tests/test_cuda.py tests/test_finufft.py -q

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [sdist, wheels, test-wheels, wheels-cuda, test-cuda-wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/bartorch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: cuda-wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
