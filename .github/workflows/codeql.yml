name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    # Code scanning on a private repository needs GitHub Advanced Security,
    # and uploading results without it is a hard error rather than a warning.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # c-cpp covers src/csrc; build-mode none reads the sources without
        # compiling BART, so the submodules are not checked out.
        language: [python, c-cpp]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - external
              - attic
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
