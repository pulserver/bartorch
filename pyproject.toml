[build-system]
requires = [
    "scikit-build-core>=0.11",
    "setuptools-scm>=8",
    # oneMKL's FFTW3 header, for the FINUFFT modules on oneMKL; no library.
    "mkl-include; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
build-backend = "scikit_build_core.build"

[project]
name = "bartorch"
# From the git tag, so a release cannot disagree with the tag that made it.
dynamic = ["version"]
description = "BART, the Berkeley Advanced Reconstruction Toolbox, embedded in PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    # mri-nufft below asks for numpy>=2.2 and scipy>=1.13, so these are the
    # floors an install actually resolves to; stating lower ones claimed
    # support for versions no install of this package can use.
    "numpy>=2.2",
    # BLAS and LAPACK come from compiled libraries already in the process:
    # what torch links, and SciPy's cython_blas / cython_lapack tables.
    "scipy>=1.13",
    # Off-resonance correction fits its coefficients by a least-squares
    # problem over a histogram of the field map -- not something BART has a
    # primitive for, and not something to write a second time.  mri-nufft has
    # three factorizations of it (svd, mti, mfi) and bartorch.linop's
    # FieldCorrected calls them.
    #
    # It is a dependency rather than an extra, which costs every install:
    # it sets the numpy and scipy floors above, and asks for matplotlib, which
    # its very first module imports.  That was weighed and accepted --
    # off-resonance is the common case here, not a corner.
    "mri-nufft>=1.0",
    # 2.2 is deepinv's floor; stated here rather than left to the resolver.
    "torch>=2.2",
    # On macOS the library's OpenMP is the libomp.dylib torch carries, which
    # torch's wheels carry from 2.3 on.
    "torch>=2.3; sys_platform == 'darwin'",
    # On Linux it is torch's libgomp.so.1; before 2.7.1 torch's copy carried
    # a hashed name the library's NEEDED entry does not match.
    "torch>=2.7.1; sys_platform == 'linux'",
    # BlochSim is the signal model.  `nlop.SignalModel` turns any of its
    # simulators into a BART nonlinear operator -- value, Jacobian-vector
    # product and adjoint product, which is exactly what `nlop_s` asks for --
    # and `nlop.InversionRecovery`, `nlop.MultiEcho` and `nlop.Bloch` are
    # `moba`'s families written on it.  Every quantitative reconstruction here
    # goes through it, so it is not an extra.
    #
    # It asks for numpy, scipy and torch, all of which are here already, and
    # nothing else.
    "blochsim>=0.0.10",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# `bartorch` is `bart`'s command line, served in this process.  A script that
# calls `bart` runs against it unchanged, which is what the name is for.
[project.scripts]
bartorch = "bartorch.cli:main"

[project.urls]
Homepage = "https://github.com/pulserver/bartorch"
Documentation = "https://pulserver.github.io/bartorch/"
Repository = "https://github.com/pulserver/bartorch"
Issues = "https://github.com/pulserver/bartorch/issues"

[project.optional-dependencies]
# deepinv is a source of denoisers, losses and samplers, reached through
# `priors.ImplicitPrior` and `bartorch.interop.to_deepinv`; nothing else here
# imports it.
deepinv = [
    "deepinv>=0.2",
]
# The training stages and augmentation, `bartorch.learning.Reconstruction` and
# `bartorch.learning.RandomGain`; the networks and the rest of
# `bartorch.learning` need neither.
learning = [
    "lightning>=2.2",
    "torchio>=0.19",
]
# ISMRMRD raw data, DICOM and NIfTI images for `bartorch.io`, each imported by
# the functions that read or write it.  h5py comes with ismrmrd.
io = [
    "ismrmrd>=1.14",
    "pydicom>=3.0",
    "nibabel>=5.0",
]
# MKL covers every BLAS and LAPACK routine BART calls and is about twice as
# fast as the alternatives on the work that leans on LAPACK.  There is no MKL
# wheel for macOS, where SciPy's OpenBLAS and Accelerate serve instead; on
# Windows SciPy's OpenBLAS serves.
mkl = [
    "mkl>=2024; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# The library compiled with CUDA, for torch's CUDA 12 or CUDA 13 builds
# (src/cuda/).  Each of those pins the bartorch it was built with, so pip
# installs the one built with this version; there is a CUDA build for Linux
# x86-64 only.
cu12 = [
    "bartorch-cuda12; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
cu13 = [
    "bartorch-cuda13; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# SimpleITK resamples for bias field and gradient nonlinearity correction, and
# registers navigator planes; it is imported by the functions that use it.
correct = [
    "SimpleITK>=2.3",
]
motion = [
    "SimpleITK>=2.3",
]
# PyHySCO is GPL-3.0-only: installing it is the user's decision, it is never
# distributed with bartorch, and `tools.correct_susceptibility` imports it only
# when called.
pyhysco = [
    "PyHySCO",
]
dev = [
    "pytest>=7",
    "pytest-xdist>=3",
    "SimpleITK>=2.3",
    # tests/test_docstrings.py reads the docstrings as the reference does.
    "numpydoc>=1.6",
    "ruff",
]
# Kept the same as docs/requirements.txt.  Rendering imports the package from
# the checkout, which needs torch but not the compiled library.
docs = [
    "sphinx>=7.3,<9",
    "sphinx-book-theme>=1.1,<2",
    "sphinx-copybutton>=0.5,<1",
    "myst-parser>=3,<5",
]

# The compiled library is pure C reached through ctypes, so one wheel per
# platform serves every interpreter and every torch version.
[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/bartorch"]
wheel.py-api = "py3"
# The wheel carries BART, FINUFFT, pocketfft and the Blocks runtime compiled
# in, so it carries their license notices too, each under its own path in the
# wheel's `.dist-info/licenses/`.  FINUFFT's dependencies are compiled in with
# it, and cmake/finufft.cmake writes their notices into the build tree at
# configure time: DUCC0's, and xsimd's.
wheel.license-files = [
    "LICENSE",
    "external/bart/LICENSE",
    "external/finufft/LICENSE",
    "external/finufft/NOTICE",
    "external/pocketfft/LICENSE.md",
    "external/blocksruntime/LICENSE.TXT",
    "LICENSES/python-ismrmrd-server-MIT.txt",
]
sdist.exclude = ["attic/", "build/"]

# The section has to exist for setuptools-scm to be used at all, even empty.
# A checkout with no tags -- a fork, a shallow clone, an sdist unpacked outside
# git -- gets the fallback rather than an error, because a missing tag should
# not be a build failure.
[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
# Written by scripts/gen_abi.py and scripts/gen_catalogue.py, and held against
# those generators by tests/test_abi.py and tests/test_catalogue.py.  A
# formatter that rewrote them would fail that test rather than fix anything;
# how they are laid out is the generator's business.
exclude = ["src/bartorch/_abi.py", "src/bartorch/_catalogue.py"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
# A gallery example is written in cells, and an import belongs to the cell that
# introduces what it imports rather than to the top of the file.
"docs/examples/*" = ["E402"]
# A help string BART wrote can be longer than any line length on its own.
"src/bartorch/_catalogue.py" = ["E501"]

[tool.coverage.run]
# The package, measured where the editable install imports it from; relative
# paths are what Codecov matches against the repository.
source = ["bartorch"]
relative_files = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.codespell]
# One place for what the spelling check reads, so that `scripts/lint.sh` and
# the workflow cannot drift apart.  The skips need the `./` codespell prints,
# or they match nothing: `external/` did not exclude `./external/bart`, which
# is why this check had never passed.  `nd` and `optin` are identifiers rather
# than typos -- BART writes `int ND` for a doubled dimension count, and CUDA
# spells its own attribute `cudaDevAttrMaxSharedMemoryPerBlockOptin`.  `build`
# and `docs/_build` are outputs a fresh checkout does not have and a local run
# does.  `reson` is the journal abbreviation in a citation, as in
# `Magn Reson Med`; `gool` and `unser` are authors' names in citations, and
# `precessing` is what a spin does.
skip = "./attic,./external,./.git,./build,./docs/_build,./docs/auto_examples,*.ipynb,pyproject.toml"
ignore-words-list = "ist,te,reconet,pyramide,nd,optin,lamda,reson,coo,gool,unser,precessing"
